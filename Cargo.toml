[workspace]
members = ["crates/growl_core"]
resolver = "2"

[package]
name = "grey-owl"
version = "0.1.0"
edition = "2024"
description = "A wiki linter for Open Knowledge Format (OKF)"

[[bin]]
name = "growl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
growl_core = { path = "crates/growl_core" }
serde_json = "1"
