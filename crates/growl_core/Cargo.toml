[package]
name = "growl_core"
version = "0.1.0"
edition = "2024"
description = "Core library for validating structured Markdown wikis"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2"
